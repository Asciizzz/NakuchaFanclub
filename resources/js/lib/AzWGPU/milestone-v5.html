<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>AsczWGPU Milestone V5 - WeebGPU Kickoff</title>
	<link rel="stylesheet" href="shared.css">
	<style>
		html,
		body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}

		#stage {
			width: 100vw;
			height: 100vh;
			display: block;
			background: #000;
		}

		#hud {
			position: fixed;
			top: 10px;
			left: 10px;
			padding: 8px 10px;
			background: rgba(0, 0, 0, 0.72);
			color: #b9d8ff;
			font: 12px/1.45 Consolas, "Courier New", monospace;
			white-space: pre;
			pointer-events: none;
			border: 1px solid #12243d;
		}
	</style>
</head>
<body>
	<canvas id="stage"></canvas>
	<div id="hud">Booting WeebGPU...</div>

	<script src="../AzMath.js"></script>
	<script src="../AzWGPU.js"></script>
	<script src="../WeebGPU/WeebGPU.js"></script>
	<script>
		(async function main() {
			const { AzPass } = window.AzWGPU;
			const { EzScene, ZMaterial, ZMesh, ZGeometry } = window.WeebGPU;

			const canvas = document.getElementById("stage");
			const hud = document.getElementById("hud");

			// This cfg is intentionally in-script so you can tweak fast
			const cfg = {
				gridX: 128,
				gridZ: 128,
				layers: 20,
				spacing: 2.35,
				scale: 0.72,
				orbitSpeed: 0.16,
			};
			const cubeCount = cfg.gridX * cfg.gridZ * cfg.layers;

			const scene = await EzScene.create({
				canvas,
				useDepth: true,
				dprCap: 2,
			});

			const camera = EzScene.makeOrbitCamera({
				target: [0, 6, 0],
				radius: Math.max(cfg.gridX, cfg.gridZ) * cfg.spacing * 0.72,
				near: 0.1,
				far: 30000,
				fovDeg: 60,
			});

			const cube = ZGeometry.cube(1);
			const instanceStride = 16; // pos.xyz + seed
			const instanceData = new Float32Array(cubeCount * 4);

			// Build static instance stream once, GPU uses this forever
			let ptr = 0;
			for (let y = 0; y < cfg.layers; y++) {
				for (let z = 0; z < cfg.gridZ; z++) {
					for (let x = 0; x < cfg.gridX; x++) {
						const ox = (x - (cfg.gridX - 1) * 0.5) * cfg.spacing;
						const oy = (y - (cfg.layers - 1) * 0.5) * cfg.spacing;
						const oz = (z - (cfg.gridZ - 1) * 0.5) * cfg.spacing;
						const seed = (x * 73856093 ^ y * 19349663 ^ z * 83492791) >>> 0;
						instanceData[ptr++] = ox;
						instanceData[ptr++] = oy;
						instanceData[ptr++] = oz;
						instanceData[ptr++] = (seed % 100000) / 100000;
					}
				}
			}

			const shaderCode = `
struct Scene {
	viewProj: mat4x4f,
	params0: vec4f, // time, scale, spacing, count
	params1: vec4f, // gridX, gridZ, layers, orbit
}

@group(0) @binding(0) var<uniform> scene: Scene;

struct VSIn {
	@location(0) pos: vec3f,
	@location(1) normal: vec3f,
	@location(2) inst: vec4f,
	@builtin(instance_index) instanceIndex: u32,
}

struct VSOut {
	@builtin(position) position: vec4f,
	@location(0) normal: vec3f,
	@location(1) tint: vec3f,
}

@vertex
fn vs_main(input: VSIn) -> VSOut {
	let t = scene.params0.x;
	let scale = scene.params0.y;
	let seed = input.inst.w;
	let phase = t * (0.65 + seed * 1.5) + f32(input.instanceIndex) * 0.00037;

	let cy = cos(phase);
	let sy = sin(phase);
	let cx = cos(phase * 0.7);
	let sx = sin(phase * 0.7);

	var p = input.pos * scale;
	let py = p.y * cx - p.z * sx;
	let pz = p.y * sx + p.z * cx;
	p.y = py;
	p.z = pz;
	let px = p.x * cy + p.z * sy;
	let pzz = -p.x * sy + p.z * cy;
	p.x = px;
	p.z = pzz;

	let wobble = vec3f(
		sin(phase * 1.1) * 0.08,
		sin(phase * 1.9) * 0.12,
		cos(phase * 1.3) * 0.08
	);
	let world = p + input.inst.xyz + wobble;

	var n = normalize(input.normal);
	let ny = n.y * cx - n.z * sx;
	let nz = n.y * sx + n.z * cx;
	n.y = ny;
	n.z = nz;
	let nx = n.x * cy + n.z * sy;
	let nzz = -n.x * sy + n.z * cy;
	n.x = nx;
	n.z = nzz;

	let tint = vec3f(
		0.30 + 0.70 * fract(seed * 13.7),
		0.35 + 0.60 * fract(seed * 27.1),
		0.40 + 0.55 * fract(seed * 41.9)
	);

	var out: VSOut;
	out.position = scene.viewProj * vec4f(world, 1.0);
	out.normal = n;
	out.tint = tint;
	return out;
}

@fragment
fn fs_main(input: VSOut) -> @location(0) vec4f {
	let N = normalize(input.normal);
	let L = normalize(vec3f(0.35, 0.84, 0.42));
	let diff = max(dot(N, L), 0.0);
	let rim = pow(1.0 - max(N.z * 0.5 + 0.5, 0.0), 1.8);
	let light = 0.24 + diff * 0.76 + rim * 0.06;
	return vec4f(input.tint * light, 1.0);
}
`;

			const material = ZMaterial.createRender(scene, {
				shader: { code: shaderCode },
				uniformSize: 96,
				vertexBuffers: [
					cube.vertexLayout[0],
					{
						arrayStride: instanceStride,
						stepMode: "instance",
						attributes: [
							{ shaderLocation: 2, offset: 0, format: "float32x4" },
						],
					},
				],
				primitive: { topology: "triangle-list", cullMode: "back" },
			});

			const mesh = ZMesh.create(scene, {
				material,
				vertices: cube.vertices,
				indices: cube.indices,
				vertexStride: cube.vertexStride,
				instanceStride,
				instanceCapacity: cubeCount,
				instanceCount: cubeCount,
			});
			ZMesh.updateInstances(scene, mesh, instanceData, cubeCount);

			const uniforms = new Float32Array(24);
			let dragging = false;
			let fps = 0;
			let fpsFrames = 0;
			let fpsTime = performance.now();
			let prev = performance.now();

			canvas.addEventListener("mousedown", (e) => {
				if (e.button !== 0) return;
				dragging = true;
			});
			globalThis.addEventListener("mouseup", () => {
				dragging = false;
			});
			globalThis.addEventListener("mousemove", (e) => {
				if (!dragging) return;
				EzScene.updateOrbitCamera(camera, {
					deltaX: e.movementX,
					deltaY: e.movementY,
					rotateSpeed: 0.0032,
				});
			});
			canvas.addEventListener("wheel", (e) => {
				e.preventDefault();
				EzScene.updateOrbitCamera(camera, {
					wheel: e.deltaY,
					zoomSpeed: 0.0012,
				});
			}, { passive: false });

			function frame(now) {
				const dt = Math.min((now - prev) / 1000, 0.05);
				prev = now;

				camera.yaw += dt * cfg.orbitSpeed;
				EzScene.updateViewProj(camera, scene.width / scene.height);

				uniforms.set(camera.viewProj, 0);
				uniforms[16] = now * 0.001;
				uniforms[17] = cfg.scale;
				uniforms[18] = cfg.spacing;
				uniforms[19] = cubeCount;
				uniforms[20] = cfg.gridX;
				uniforms[21] = cfg.gridZ;
				uniforms[22] = cfg.layers;
				uniforms[23] = cfg.orbitSpeed;
				ZMaterial.writeUniform(scene, material, uniforms);

				const f = EzScene.beginFrame(scene, {
					clearColor: { r: 0, g: 0, b: 0, a: 1 },
					label: "WeebGPUFrame",
				});
				AzPass.withRender(f.encoder, f.passDescriptor, (pass) => {
					ZMesh.draw(pass, mesh);
				});
				EzScene.endFrame(scene, f);

				fpsFrames++;
				if (now - fpsTime >= 450) {
					fps = fpsFrames * 1000 / (now - fpsTime);
					fpsFrames = 0;
					fpsTime = now;
				}

				hud.textContent = [
					"01 WeebGPU Kickoff",
					"What this shows:",
					"EzScene + ZMaterial + ZMesh + ZGeometry layered over AzWGPU",
					"",
					`Massive instancing: ${cubeCount.toLocaleString()} cubes`,
					`FPS: ${fps.toFixed(1)}`,
					`Canvas: ${scene.width} x ${scene.height}`,
					"Mouse drag: orbit camera",
					"Scroll: infinite zoom style orbit",
				].join("\n");

				requestAnimationFrame(frame);
			}

			requestAnimationFrame(frame);
		})();
	</script>
</body>
</html>
