<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EzTree Scene Graph Demo</title>
<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: white;
        font-family: monospace;
    }

    canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #1a1a1a;
    }

    .toolbar {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        display: flex;
        gap: 10px;
    }

    button {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #2b2b2b;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #444;
    }
</style>
</head>
<body>

<div class="toolbar">
    <button id="addBtn">Add Node</button>
</div>

<canvas id="canvas"></canvas>

<script>
/* EzTree
By Asciiz (duh)
*/

class EzNode {
    name = "";
    parent = null;
    children = [];
    $ = {};

    rename(newName) { this.name = newName; }
    set(compKey, compData) { this.$[compKey] = compData; }
    get(compKey) { return this.$[compKey]; }
    remove(compKey) { delete this.$[compKey]; }
}

class EzTree {
    nodes = new Map();
    rootId = null;
    #idCounter = 0;

    #genId() {
        return this.#idCounter++;
    }

    constructor(rootName) {
        const rootNode = new EzNode();
        rootNode.name = rootName;

        const id = this.#genId();

        this.nodes.set(id, rootNode);
        this.rootId = id;
    }

    addNode(name, parentId = null) {
        parentId = parentId ?? this.rootId;

        const parentNode = this.nodes.get(parentId);
        if (!parentNode) return null;

        const node = new EzNode();
        node.name = name;
        node.parent = parentId;

        const id = this.#genId();

        this.nodes.set(id, node);
        parentNode.children.push(id);

        return { id, node };
    }

    getNode(id) {
        return this.nodes.get(id);
    }

    reparentNode(id, newParentId) {
        if (id === newParentId) return false;

        const node = this.nodes.get(id);
        const newParent = this.nodes.get(newParentId);

        if (!node || !newParent) return false;

        let current = newParent;

        while (current) {
            if (current === node) return false;
            current = this.nodes.get(current.parent);
        }

        const oldParent = this.nodes.get(node.parent);

        if (oldParent) {
            const index = oldParent.children.indexOf(id);

            if (index !== -1)
                oldParent.children.splice(index, 1);
        }

        newParent.children.push(id);
        node.parent = newParentId;

        return true;
    }

    removeNode(id, recursive = true) {
        if (id === this.rootId) return false;

        const node = this.nodes.get(id);
        if (!node) return false;

        if (recursive) {
            const toRemove = [id];
            const stack = [...node.children];

            while (stack.length > 0) {
                const currentId = stack.pop();
                const currentNode = this.nodes.get(currentId);

                if (!currentNode) continue;

                toRemove.push(currentId);
                stack.push(...currentNode.children);
            }

            for (const removeId of toRemove)
                this.nodes.delete(removeId);

            const parentNode = this.nodes.get(node.parent);

            if (parentNode) {
                const index = parentNode.children.indexOf(id);

                if (index !== -1)
                    parentNode.children.splice(index, 1);
            }

        } else {

            for (const childId of node.children) {
                const child = this.nodes.get(childId);

                if (child)
                    child.parent = node.parent;
            }

            const parentNode = this.nodes.get(node.parent);

            if (parentNode) {
                parentNode.children = parentNode.children
                    .filter(c => c !== id)
                    .concat(node.children);
            }

            this.nodes.delete(id);
        }

        return true;
    }

    *traverse(startId = this.rootId, DFS = true) {
        const startNode = this.nodes.get(startId);
        if (!startNode) return;

        const queue = [startId];

        while (queue.length > 0) {

            const currentId = DFS
                ? queue.pop()
                : queue.shift();

            const currentNode = this.nodes.get(currentId);
            if (!currentNode) continue;

            yield [currentId, currentNode];

            queue.push(...currentNode.children);
        }
    }
}

const DEFAULT_RADIUS = 28;

class SceneTree extends EzTree {

    addSceneNode(name, parentId = null, x = 0, y = 0) {

        const result = this.addNode(name, parentId);
        if (!result) return null;

        result.node.set("transform", {
            local: { x, y },
            global: { x, y }
        });

        result.node.set("radius", DEFAULT_RADIUS);

        return result;
    }

    updateTransforms() {

        for (const [id, node] of this.traverse()) {

            const transform = node.get("transform");
            if (!transform) continue;

            if (node.parent === null) {
                transform.global.x = transform.local.x;
                transform.global.y = transform.local.y;
                continue;
            }

            const parent = this.getNode(node.parent);
            const parentTransform = parent?.get("transform");

            if (!parentTransform) continue;

            transform.global.x =
                parentTransform.global.x +
                transform.local.x;

            transform.global.y =
                parentTransform.global.y +
                transform.local.y;
        }
    }
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

const tree = new SceneTree("Root");

const root = tree.getNode(tree.rootId);

root.set("transform", {
    local: {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2
    },
    global: {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2
    }
});

root.set("radius", DEFAULT_RADIUS + 10);

let nodeCounter = 0;

function spawnNode() {

    return tree.addSceneNode(
        `Node_${nodeCounter++}`,
        tree.rootId,
        0,
        0
    );
}

spawnNode();
spawnNode();
spawnNode();

let leftDragging = null;
let rightDragging = null;

function getMousePos(e) {

    const rect = canvas.getBoundingClientRect();

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

function getNodeAt(x, y) {

    const reversed = [...tree.traverse()].reverse();

    for (const [id, node] of reversed) {

        const transform = node.get("transform");
        if (!transform) continue;

        const radius = node.get("radius") ?? DEFAULT_RADIUS;

        const dx = x - transform.global.x;
        const dy = y - transform.global.y;

        if (Math.hypot(dx, dy) <= radius)
            return { id, node };
    }

    return null;
}

canvas.addEventListener("contextmenu", e => {
    e.preventDefault();
});

canvas.addEventListener("mousedown", e => {

    const mouse = getMousePos(e);
    const hit = getNodeAt(mouse.x, mouse.y);

    if (!hit) return;

    if (e.button === 0) {
        leftDragging = {
            id: hit.id
        };
    }

    if (e.button === 2) {
        rightDragging = {
            sourceId: hit.id
        };
    }

    if (e.button === 1) {

        const recursive = !e.shiftKey;

        tree.removeNode(hit.id, recursive);
        tree.updateTransforms();
    }
});

canvas.addEventListener("wheel", e => {

    const mouse = getMousePos(e);
    const hit = getNodeAt(mouse.x, mouse.y);

    if (!hit) return;

    e.preventDefault();

    const radius = hit.node.get("radius") ?? DEFAULT_RADIUS;

    hit.node.set(
        "radius",
        Math.max(5, radius - Math.sign(e.deltaY) * 4)
    );

}, { passive: false });

canvas.addEventListener("mousemove", e => {

    if (!leftDragging) return;

    const mouse = getMousePos(e);

    const node = tree.getNode(leftDragging.id);
    if (!node) return;

    const transform = node.get("transform");
    if (!transform) return;

    if (node.parent === null) {

        transform.local.x = mouse.x;
        transform.local.y = mouse.y;

    } else {

        const parent = tree.getNode(node.parent);
        const parentTransform = parent?.get("transform");

        if (!parentTransform) return;

        transform.local.x =
            mouse.x - parentTransform.global.x;

        transform.local.y =
            mouse.y - parentTransform.global.y;
    }

    tree.updateTransforms();
});

canvas.addEventListener("mouseup", e => {

    const mouse = getMousePos(e);

    if (e.button === 0)
        leftDragging = null;

    if (e.button === 2 && rightDragging) {

        const target = getNodeAt(mouse.x, mouse.y);

        if (target && target.id !== rightDragging.sourceId) {

            const source = tree.getNode(rightDragging.sourceId);
            const targetNode = tree.getNode(target.id);

            if (source && targetNode) {

                const sourceTransform = source.get("transform");
                const targetTransform = targetNode.get("transform");

                if (sourceTransform && targetTransform) {

                    const oldGlobalX = sourceTransform.global.x;
                    const oldGlobalY = sourceTransform.global.y;

                    const success = tree.reparentNode(
                        rightDragging.sourceId,
                        target.id
                    );

                    if (success) {

                        sourceTransform.local.x =
                            oldGlobalX - targetTransform.global.x;

                        sourceTransform.local.y =
                            oldGlobalY - targetTransform.global.y;

                        tree.updateTransforms();
                    }
                }
            }
        }

        rightDragging = null;
    }
});

function drawConnections() {

    ctx.strokeStyle = "#555";
    ctx.lineWidth = 2;

    for (const [id, node] of tree.traverse()) {

        if (node.parent === null) continue;

        const transform = node.get("transform");

        const parent = tree.getNode(node.parent);
        const parentTransform = parent?.get("transform");

        if (!transform || !parentTransform)
            continue;

        ctx.beginPath();
        ctx.moveTo(
            parentTransform.global.x,
            parentTransform.global.y
        );

        ctx.lineTo(
            transform.global.x,
            transform.global.y
        );

        ctx.stroke();
    }
}

function drawNodes() {

    for (const [id, node] of tree.traverse()) {

        const transform = node.get("transform");
        if (!transform) continue;

        const radius = node.get("radius") ?? DEFAULT_RADIUS;

        const x = transform.global.x;
        const y = transform.global.y;

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);

        ctx.fillStyle =
            id === tree.rootId
                ? "#ff8844"
                : "#66ccff";

        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "12px monospace";

        ctx.fillText(node.name, x, y);
    }
}

function render() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    tree.updateTransforms();

    drawConnections();
    drawNodes();

    requestAnimationFrame(render);
}

render();

const addBtn = document.getElementById("addBtn");

addBtn.addEventListener("click", () => {
    spawnNode();
});
</script>

</body>
</html>
