<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Azt Ctx Node Editor</title>
	<style>
		:root {
			--bg-a: #0f172a;
			--bg-b: #111827;
			--panel: #020617d9;
			--line: #334155;
			--text: #e2e8f0;
			--sub: #94a3b8;
		}
		* { box-sizing: border-box; }
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: radial-gradient(circle at 20% 15%, var(--bg-a), var(--bg-b));
			color: var(--text);
			font-family: Consolas, "Courier New", monospace;
		}
		canvas {
			display: block;
			width: 100%;
			height: 100%;
		}
		#panel {
			position: fixed;
			top: 12px;
			right: 12px;
			width: 320px;
			padding: 12px;
			border: 1px solid var(--line);
			border-radius: 10px;
			background: var(--panel);
			backdrop-filter: blur(6px);
		}
		#title {
			margin: 0 0 10px;
			font-size: 14px;
			color: #93c5fd;
		}
		.grid {
			display: grid;
			grid-template-columns: 88px 1fr;
			gap: 8px;
			align-items: center;
		}
		label {
			color: var(--sub);
			font-size: 12px;
		}
		input, button {
			width: 100%;
			font: inherit;
			font-size: 12px;
			color: var(--text);
			background: #0f172a;
			border: 1px solid #334155;
			border-radius: 6px;
			padding: 6px 8px;
		}
		button {
			cursor: pointer;
		}
		.row {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
			margin-top: 10px;
		}
		.row3 {
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
			gap: 8px;
			margin-top: 8px;
		}
		.help {
			margin-top: 10px;
			font-size: 11px;
			color: var(--sub);
			line-height: 1.4;
		}
		.badge {
			margin-bottom: 10px;
			font-size: 12px;
			color: #cbd5e1;
			padding: 6px 8px;
			border: 1px dashed #334155;
			border-radius: 6px;
			background: #020617a6;
		}
		.meta {
			margin-bottom: 10px;
			padding: 8px;
			border: 1px dashed #334155;
			border-radius: 6px;
			background: #02061780;
			font-size: 11px;
			line-height: 1.45;
			color: var(--sub);
			word-break: break-word;
		}
	</style>
</head>
<body>
	<canvas id="view"></canvas>
	<div id="panel">
		<h1 id="title">Azt Draggable Node Editor</h1>
		<div id="selectedInfo" class="badge">Selected: none</div>
		<div id="nodeMeta" class="meta">
			<div id="parentInfo">parent: -</div>
			<div id="childrenInfo">children: -</div>
		</div>
		<div class="grid">
			<label for="nameInput">Name</label>
			<input id="nameInput" type="text" />
			<label for="xInput">Local X</label>
			<input id="xInput" type="number" step="1" />
			<label for="yInput">Local Y</label>
			<input id="yInput" type="number" step="1" />
			<label for="wInput">Width</label>
			<input id="wInput" type="number" step="1" min="40" />
			<label for="hInput">Height</label>
			<input id="hInput" type="number" step="1" min="20" />
			<label for="bgInput">Background</label>
			<input id="bgInput" type="color" />
			<label for="borderInput">Border</label>
			<input id="borderInput" type="color" />
			<label for="textInput">Text</label>
			<input id="textInput" type="color" />
		</div>
		<div class="row">
			<input id="swapAInput" type="number" step="1" min="0" placeholder="child index A" />
			<input id="swapBInput" type="number" step="1" min="0" placeholder="child index B" />
		</div>
		<div class="row">
			<button id="swapChildrenBtn" type="button">swapChildrenOrder(A, B)</button>
			<div></div>
		</div>
		<div class="row">
			<button id="addChildBtn" type="button">Add Child</button>
			<button id="addRootBtn" type="button">Add Root</button>
		</div>
		<div class="row">
			<button id="deleteSingleBtn" type="button">Delete Single</button>
			<button id="deleteBranchBtn" type="button">Delete Branch</button>
		</div>
		<div class="row3">
			<button id="removePulseBtn" type="button">remove("pulse")</button>
			<button id="togglePulseBtn" type="button">Toggle Pulse</button>
			<button id="randomColorBtn" type="button">Random Color</button>
		</div>
		<div class="help">
			Drag nodes on canvas. Child world transform follows parent `x/y`.
			No rotation. Edit selected node properties live.
		</div>
	</div>

	<script type="module">
		import Azt from "./resources/js/AzLib/Azt.js";

		const canvas = document.getElementById("view");
		const ctx = canvas.getContext("2d");
		const selectedInfo = document.getElementById("selectedInfo");
		const parentInfo = document.getElementById("parentInfo");
		const childrenInfo = document.getElementById("childrenInfo");
		const nameInput = document.getElementById("nameInput");
		const xInput = document.getElementById("xInput");
		const yInput = document.getElementById("yInput");
		const wInput = document.getElementById("wInput");
		const hInput = document.getElementById("hInput");
		const bgInput = document.getElementById("bgInput");
		const borderInput = document.getElementById("borderInput");
		const textInput = document.getElementById("textInput");
		const swapAInput = document.getElementById("swapAInput");
		const swapBInput = document.getElementById("swapBInput");
		const swapChildrenBtn = document.getElementById("swapChildrenBtn");
		const addChildBtn = document.getElementById("addChildBtn");
		const addRootBtn = document.getElementById("addRootBtn");
		const deleteSingleBtn = document.getElementById("deleteSingleBtn");
		const deleteBranchBtn = document.getElementById("deleteBranchBtn");
		const removePulseBtn = document.getElementById("removePulseBtn");
		const togglePulseBtn = document.getElementById("togglePulseBtn");
		const randomColorBtn = document.getElementById("randomColorBtn");

		function resize() {
			const dpr = Math.max(1, window.devicePixelRatio || 1);
			canvas.width = Math.floor(window.innerWidth * dpr);
			canvas.height = Math.floor(window.innerHeight * dpr);
			canvas.style.width = `${window.innerWidth}px`;
			canvas.style.height = `${window.innerHeight}px`;
			ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		}
		resize();
		window.addEventListener("resize", resize);

		function hueFromId(id) {
			const n = Number(String(id).split("_").pop()) || 0;
			return (n * 53) % 360;
		}

		function toHexColor(value, fallback = "#60a5fa") {
			const tmp = document.createElement("canvas").getContext("2d");
			tmp.fillStyle = fallback;
			tmp.fillStyle = value || fallback;
			const css = tmp.fillStyle;
			if (css[0] === "#") {
				if (css.length === 4) {
					return `#${css[1]}${css[1]}${css[2]}${css[2]}${css[3]}${css[3]}`;
				}
				return css;
			}
			const m = css.match(/^rgb\\((\\d+),\\s*(\\d+),\\s*(\\d+)\\)$/);
			if (!m) return fallback;
			const toHex = (n) => Number(n).toString(16).padStart(2, "0");
			return `#${toHex(m[1])}${toHex(m[2])}${toHex(m[3])}`;
		}

		function makeTransform() {
			return {
				local: { x: 0, y: 0 },
				world: { x: 0, y: 0 },
				size: { w: 126, h: 44 },
			};
		}

		function makeColor(id) {
			const h = hueFromId(id);
			return {
				background: `hsl(${h} 82% 56%)`,
				border: `hsl(${h} 88% 84%)`,
				text: `hsl(${h} 95% 8%)`,
			};
		}

		class Rainbow extends Azt.Ctx {
			add(parent = null, index = -1) {
				const node = super.add(parent, index);
				if (!node) return null;
				node.transform = makeTransform();
				node.color = makeColor(node.id);
				node.name = node.id;
				return node;
			}
		}

		const rainbow = new Rainbow({ prefix: "rb_" });
		const root = rainbow.add();
		root.name = "Root";
		root.transform.local.y = -120;

		const a = root.add();
		const b = root.add();
		const c = root.add();
		a.name = "A";
		b.name = "B";
		c.name = "C";
		a.transform.local.x = -220;
		b.transform.local.x = 0;
		c.transform.local.x = 220;

		const a1 = a.add();
		const a2 = a.add();
		const b1 = b.add();
		a1.name = "A1";
		a2.name = "A2";
		b1.name = "B1";
		a1.transform.local.x = -86;
		a2.transform.local.x = 86;
		b1.transform.local.y = 92;

		let selected = root;
		let drag = null;
		let mouse = { x: 0, y: 0 };

		function isTypingTarget(el) {
			if (!el) return false;
			const tag = String(el.tagName || "").toLowerCase();
			return tag === "input" || tag === "textarea" || tag === "select" || el.isContentEditable === true;
		}

		function worldToScreen(wx, wy) {
			return { x: wx + (window.innerWidth * 0.5), y: wy + (window.innerHeight * 0.5) };
		}

		function screenToWorld(sx, sy) {
			return { x: sx - (window.innerWidth * 0.5), y: sy - (window.innerHeight * 0.5) };
		}

		function syncEditor() {
			if (!selected) {
				selectedInfo.textContent = "Selected: none";
				parentInfo.textContent = "parent: -";
				childrenInfo.textContent = "children: -";
				return;
			}
			const nodeName = String(selected.name ?? selected.id);
			selectedInfo.textContent = `Selected: ${nodeName} #${selected.id}`;
			selectedInfo.style.borderColor = selected.color?.border ?? "#334155";
			parentInfo.textContent = `parent: ${selected.parentId ?? "(root)"}`;
			childrenInfo.textContent = `children: ${selected.childIds.length > 0 ? selected.childIds.join(", ") : "(none)"}`;
			nameInput.value = String(selected.name ?? "");
			xInput.value = String(Math.round(selected.transform?.local?.x ?? 0));
			yInput.value = String(Math.round(selected.transform?.local?.y ?? 0));
			wInput.value = String(Math.round(selected.transform?.size?.w ?? 126));
			hInput.value = String(Math.round(selected.transform?.size?.h ?? 44));
			bgInput.value = toHexColor(selected.color?.background, "#60a5fa");
			borderInput.value = toHexColor(selected.color?.border, "#cbd5e1");
			textInput.value = toHexColor(selected.color?.text, "#0f172a");
		}

		function ensureCore(node) {
			if (!node.transform) node.transform = makeTransform();
			if (!node.transform.local) node.transform.local = { x: 0, y: 0 };
			if (!node.transform.world) node.transform.world = { x: 0, y: 0 };
			if (!node.transform.size) node.transform.size = { w: 126, h: 44 };
			if (!node.color) node.color = makeColor(node.id);
			if (!node.name) node.name = node.id;
		}

		function updateWorld() {
			for (const node of rainbow.traverse({ mode: "dfs_pre" })) {
				ensureCore(node);
				const parent = node.parent;
				if (parent && parent.transform) {
					node.transform.world.x = parent.transform.world.x + node.transform.local.x;
					node.transform.world.y = parent.transform.world.y + node.transform.local.y;
				} else {
					node.transform.world.x = node.transform.local.x;
					node.transform.world.y = node.transform.local.y;
				}
			}
		}

		function isInBranch(node, branchRoot) {
			if (!node || !branchRoot) return false;
			let cur = node;
			while (cur) {
				if (cur === branchRoot) return true;
				cur = cur.parent;
			}
			return false;
		}

		function nodeAtScreen(sx, sy, skipBranchRoot = null) {
			const list = Array.from(rainbow.traverse({ mode: "dfs_pre" }));
			for (let i = list.length - 1; i >= 0; i--) {
				const node = list[i];
				if (skipBranchRoot && isInBranch(node, skipBranchRoot)) continue;
				if (!node.transform) continue;
				const p = worldToScreen(node.transform.world.x, node.transform.world.y);
				const w = node.transform.size.w;
				const h = node.transform.size.h;
				if (sx >= p.x - (w * 0.5) && sx <= p.x + (w * 0.5) && sy >= p.y - (h * 0.5) && sy <= p.y + (h * 0.5)) {
					return node;
				}
			}
			return null;
		}

		function drawRoundRect(x, y, w, h, r) {
			ctx.beginPath();
			ctx.moveTo(x + r, y);
			ctx.lineTo(x + w - r, y);
			ctx.quadraticCurveTo(x + w, y, x + w, y + r);
			ctx.lineTo(x + w, y + h - r);
			ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
			ctx.lineTo(x + r, y + h);
			ctx.quadraticCurveTo(x, y + h, x, y + h - r);
			ctx.lineTo(x, y + r);
			ctx.quadraticCurveTo(x, y, x + r, y);
			ctx.closePath();
		}

		function render() {
			ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
			ctx.lineWidth = 2;

			for (const node of rainbow.traverse({ mode: "dfs_pre" })) {
				const parent = node.parent;
				if (!parent || !node.transform || !parent.transform) continue;
				const a = worldToScreen(parent.transform.world.x, parent.transform.world.y);
				const b = worldToScreen(node.transform.world.x, node.transform.world.y);
				ctx.strokeStyle = "rgba(148, 163, 184, 0.65)";
				ctx.beginPath();
				ctx.moveTo(a.x, a.y);
				ctx.lineTo(b.x, b.y);
				ctx.stroke();
			}

			for (const node of rainbow.traverse({ mode: "dfs_pre" })) {
				ensureCore(node);
				const p = worldToScreen(node.transform.world.x, node.transform.world.y);
				const w = node.transform.size.w;
				const h = node.transform.size.h;
				const x = p.x - (w * 0.5);
				const y = p.y - (h * 0.5);

				drawRoundRect(x, y, w, h, 10);
				ctx.fillStyle = node.color.background;
				ctx.fill();
				ctx.strokeStyle = node.color.border;
				ctx.stroke();

				if (node === selected) {
					drawRoundRect(x - 4, y - 4, w + 8, h + 8, 13);
					ctx.strokeStyle = "#f8fafc";
					ctx.lineWidth = 1.5;
					ctx.stroke();
					ctx.lineWidth = 2;
				}

				ctx.fillStyle = node.color.text;
				ctx.font = "bold 13px Consolas";
				ctx.textAlign = "center";
				ctx.textBaseline = "middle";
				ctx.fillText(node.name ?? node.id, p.x, p.y);
			}
		}

		function applyPanelToNode() {
			if (!selected) return;
			ensureCore(selected);
			selected.name = nameInput.value;
			selected.transform.local.x = Number(xInput.value || 0);
			selected.transform.local.y = Number(yInput.value || 0);
			selected.transform.size.w = Math.max(40, Number(wInput.value || 126));
			selected.transform.size.h = Math.max(20, Number(hInput.value || 44));
			selected.color.background = bgInput.value;
			selected.color.border = borderInput.value;
			selected.color.text = textInput.value;
		}

		canvas.addEventListener("mousedown", (ev) => {
			mouse.x = ev.clientX;
			mouse.y = ev.clientY;
			const hit = nodeAtScreen(ev.clientX, ev.clientY);
			if (!hit) return;
			selected = hit;
			syncEditor();
			const world = screenToWorld(ev.clientX, ev.clientY);
			const px = selected.parent?.transform?.world?.x ?? 0;
			const py = selected.parent?.transform?.world?.y ?? 0;
			drag = {
				node: selected,
				offsetX: (world.x - px) - selected.transform.local.x,
				offsetY: (world.y - py) - selected.transform.local.y,
			};
		});

		window.addEventListener("mousemove", (ev) => {
			mouse.x = ev.clientX;
			mouse.y = ev.clientY;
			if (!drag || !drag.node) return;
			const world = screenToWorld(ev.clientX, ev.clientY);
			const px = drag.node.parent?.transform?.world?.x ?? 0;
			const py = drag.node.parent?.transform?.world?.y ?? 0;
			drag.node.transform.local.x = Math.round((world.x - px) - drag.offsetX);
			drag.node.transform.local.y = Math.round((world.y - py) - drag.offsetY);
			syncEditor();
		});

		window.addEventListener("mouseup", (ev) => {
			if (drag && drag.node && ev.ctrlKey) {
				const target = nodeAtScreen(ev.clientX, ev.clientY, drag.node);
				if (target) {
					drag.node.move(target.id);
					selected = drag.node.$ === rainbow ? drag.node : selected;
					syncEditor();
				}
			}
			drag = null;
		});

		window.addEventListener("keydown", (ev) => {
			if (ev.repeat) return;
			if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
			if (String(ev.key).toLowerCase() !== "a") return;
			if (isTypingTarget(document.activeElement)) return;

			const node = rainbow.add();
			if (!node) return;
			ensureCore(node);
			const world = screenToWorld(mouse.x, mouse.y);
			node.transform.local.x = Math.round(world.x);
			node.transform.local.y = Math.round(world.y);
			selected = node;
			syncEditor();
			ev.preventDefault();
		});

		[nameInput, xInput, yInput, wInput, hInput, bgInput, borderInput, textInput].forEach((el) => {
			el.addEventListener("input", () => {
				applyPanelToNode();
				syncEditor();
			});
		});

		swapChildrenBtn.addEventListener("click", () => {
			if (!selected) return;
			const indexA = Number(swapAInput.value);
			const indexB = Number(swapBInput.value);
			selected.swapChildrenOrder(indexA, indexB);
			syncEditor();
		});

		addChildBtn.addEventListener("click", () => {
			const base = selected ?? null;
			const node = base ? base.add() : rainbow.add();
			if (!node) return;
			ensureCore(node);
			node.name = node.id;
			node.transform.local.x = 0;
			node.transform.local.y = 92;
			if (!base) node.transform.local.y = 0;
			selected = node;
			syncEditor();
		});

		addRootBtn.addEventListener("click", () => {
			const node = rainbow.add();
			if (!node) return;
			ensureCore(node);
			node.transform.local.x = Math.round((Math.random() * 300) - 150);
			node.transform.local.y = Math.round((Math.random() * 180) - 90);
			selected = node;
			syncEditor();
		});

		deleteSingleBtn.addEventListener("click", () => {
			if (!selected) return;
			const next = selected.parent ?? selected.children[0] ?? null;
			rainbow.delete(selected.id, false);
			selected = next && next.$ === rainbow ? next : null;
			syncEditor();
		});

		deleteBranchBtn.addEventListener("click", () => {
			if (!selected) return;
			const next = selected.parent ?? null;
			rainbow.delete(selected.id, true);
			selected = next && next.$ === rainbow ? next : null;
			syncEditor();
		});

		removePulseBtn.addEventListener("click", () => {
			if (!selected) return;
			selected.remove("pulse");
		});

		togglePulseBtn.addEventListener("click", () => {
			if (!selected) return;
			if (selected.pulse) {
				selected.remove("pulse");
			} else {
				selected.pulse = {
					speed: 2 + (Math.random() * 2),
					amp: 0.09 + (Math.random() * 0.11),
				};
			}
		});

		randomColorBtn.addEventListener("click", () => {
			if (!selected) return;
			const hue = Math.floor(Math.random() * 360);
			selected.color.background = `hsl(${hue} 80% 55%)`;
			selected.color.border = `hsl(${hue} 92% 84%)`;
			selected.color.text = `hsl(${hue} 95% 9%)`;
			syncEditor();
		});

		function frame(nowMs) {
			const now = nowMs * 0.001;

			for (const node of rainbow.traverse({ mode: "dfs_pre" })) {
				ensureCore(node);
				if (!node.pulse) continue;
				const t = now * node.pulse.speed;
				const s = 1 + Math.sin(t) * node.pulse.amp;
				node.transform.size.w = Math.max(40, Math.round(126 * s));
				node.transform.size.h = Math.max(20, Math.round(44 * s));
			}

			updateWorld();
			render();
			requestAnimationFrame(frame);
		}

		syncEditor();
		requestAnimationFrame(frame);
	</script>
</body>
</html>
