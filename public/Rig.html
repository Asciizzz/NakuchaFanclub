<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EzCanvas3D Camera Rig - Press K to toggle mode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 8px;
            pointer-events: none;
        }
        #ui h1 { font-size: 18px; margin-bottom: 10px; }
        #ui p { font-size: 14px; margin: 5px 0; color: #aaa; }
        #mode-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
        }
        .mode-perspective {
            background: #4a90d9;
            color: #fff;
        }
        .mode-orthographic {
            background: #d94a90;
            color: #fff;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
        }
        #controls p { margin: 4px 0; color: #ccc; }
        #controls span { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="gl"></canvas>
        <div id="ui">
            <h1>EzCanvas3D Camera Test</h1>
            <p>Current Mode: <span id="mode-badge" class="mode-perspective">Perspective</span></p>
            <p id="fov-display">FOV: 60°</p>
            <p id="ortho-display" style="display:none">Ortho Size: 18</p>
        </div>
        <div id="controls">
            <p><span>K</span> - Toggle Perspective / Orthographic</p>
            <p><span>WASD</span> - Move camera</p>
            <p><span>Arrow Keys</span> - Rotate view</p>
            <p><span>Scroll</span> - Adjust FOV / Ortho Size</p>
        </div>
    </div>

    <script src="../resources/js/global/EzCanvas3D.js"></script>
    <script>
        const canvas = document.getElementById('gl');
        const modeBadge = document.getElementById('mode-badge');
        const fovDisplay = document.getElementById('fov-display');
        const orthoDisplay = document.getElementById('ortho-display');

        const ez = new EzCanvas3D('rig-test');
        ez.settings.fitContainer();
        ez.mount(canvas);

        ez.camera.set({
            position: [12, 10, 12],
            yaw: -45,
            pitch: -35,
            fov: 60,
            orthoSize: 18,
            near: 0.1,
            far: 200
        });

        const vertexShader = `
            uniform mat4 view;
            uniform mat4 projection;
            attribute vec3 a_position;
            attribute vec3 a_color;
            varying vec3 v_color;
            void main() {
                v_color = a_color;
                gl_Position = projection * view * vec4(a_position, 1.0);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            varying vec3 v_color;
            void main() {
                gl_FragColor = vec4(v_color, 1.0);
            }
        `;

        const shader = new EzShader3D();
        shader.describe({
            vertex: {
                attributes: [
                    { name: 'a_position', size: 3 },
                    { name: 'a_color', size: 3 }
                ],
                defaultKeys: { view: 'view', projection: 'projection' },
                main: `
                    v_color = a_color;
                    gl_Position = projection * view * vec4(a_position, 1.0);
                `
            },
            fragment: {
                outputs: [{ name: 'fragColor' }],
                main: `
                    fragColor = vec4(v_color, 1.0);
                `
            }
        });
        shader.compile(ez.gl);
        ez.assets.shader.add('test', shader);

        function createCube(color, x, y, z, sx, sy, sz) {
            const r = color[0], g = color[1], b = color[2];
            const vertices = new Float32Array([
                // Front face
                -0.5, -0.5,  0.5,  r, g, b,
                 0.5, -0.5,  0.5,  r, g, b,
                 0.5,  0.5,  0.5,  r, g, b,
                -0.5,  0.5,  0.5,  r, g, b,
                // Back face
                -0.5, -0.5, -0.5,  r*0.7, g*0.7, b*0.7,
                -0.5,  0.5, -0.5,  r*0.7, g*0.7, b*0.7,
                 0.5,  0.5, -0.5,  r*0.7, g*0.7, b*0.7,
                 0.5, -0.5, -0.5,  r*0.7, g*0.7, b*0.7,
                // Top face
                -0.5,  0.5, -0.5,  r*1.2, g*1.2, b*1.2,
                -0.5,  0.5,  0.5,  r*1.2, g*1.2, b*1.2,
                 0.5,  0.5,  0.5,  r*1.2, g*1.2, b*1.2,
                 0.5,  0.5, -0.5,  r*1.2, g*1.2, b*1.2,
                // Bottom face
                -0.5, -0.5, -0.5,  r*0.5, g*0.5, b*0.5,
                 0.5, -0.5, -0.5,  r*0.5, g*0.5, b*0.5,
                 0.5, -0.5,  0.5,  r*0.5, g*0.5, b*0.5,
                -0.5, -0.5,  0.5,  r*0.5, g*0.5, b*0.5,
                // Right face
                 0.5, -0.5, -0.5,  r*0.8, g*0.8, b*0.8,
                 0.5,  0.5, -0.5,  r*0.8, g*0.8, b*0.8,
                 0.5,  0.5,  0.5,  r*0.8, g*0.8, b*0.8,
                 0.5, -0.5,  0.5,  r*0.8, g*0.8, b*0.8,
                // Left face
                -0.5, -0.5, -0.5,  r*0.8, g*0.8, b*0.8,
                -0.5, -0.5,  0.5,  r*0.8, g*0.8, b*0.8,
                -0.5,  0.5,  0.5,  r*0.8, g*0.8, b*0.8,
                -0.5,  0.5, -0.5,  r*0.8, g*0.8, b*0.8,
            ]);

            const indices = new Uint16Array([
                0, 1, 2,   0, 2, 3,
                4, 5, 6,   4, 6, 7,
                8, 9, 10,  8, 10, 11,
                12, 13, 14, 12, 14, 15,
                16, 17, 18, 16, 18, 19,
                20, 21, 22, 20, 22, 23,
            ]);

            return {
                vertices,
                indices,
                position: [x, y, z],
                scale: [sx, sy, sz]
            };
        }

        // Larger, more varied scene to better visualize orthographic vs perspective
        const cubes = [
            createCube([0.9, 0.3, 0.3], 0, 1, 0, 2, 2, 2),
            createCube([0.3, 0.9, 0.3], -6, 2, -6, 1.5, 3, 1.5),
            createCube([0.3, 0.3, 0.9], 6, 1.5, 6, 1.5, 1.5, 1.5),
            createCube([0.9, 0.9, 0.3], -6, 3, 6, 1, 4, 1),
            createCube([0.3, 0.9, 0.9], 6, 1, -6, 2, 1, 2),
            createCube([0.9, 0.5, 0.1], 0, 0.5, -8, 1, 1, 1),
            createCube([0.1, 0.5, 0.9], 8, 2, 0, 1, 3, 1),
            createCube([0.5, 0.9, 0.5], -8, 1, 8, 2, 1.5, 2),
            createCube([0.7, 0.7, 0.7], 0, -2, 0, 20, 0.5, 20),
        ];

        cubes.forEach((cube, i) => {
            ez.assets.model.add(`cube${i}`, {
                defaultShader: 'test',
                vertices: cube.vertices,
                indices: cube.indices,
                attributes: [{ name: 'a_position', size: 3 }, { name: 'a_color', size: 3 }]
            });

            ez.addInstance(`cube${i}`, {
                data: {
                    mat4: { position: cube.position, scale: cube.scale }
                }
            });
        });

        function createGrid() {
            const size = 20;
            const step = 2;
            const vertices = [];
            const color1 = [0.25, 0.25, 0.35];
            const color2 = [0.15, 0.15, 0.25];

            for (let i = -size; i <= size; i += step) {
                const c = (Math.abs(i) % 4 === 0) ? color1 : color2;
                vertices.push(i, 0, -size, ...c);
                vertices.push(i, 0, size, ...c);
                vertices.push(-size, 0, i, ...c);
                vertices.push(size, 0, i, ...c);
            }

            ez.assets.model.add('grid', {
                defaultShader: 'test',
                vertices: new Float32Array(vertices),
                attributes: [{ name: 'a_position', size: 3 }, { name: 'a_color', size: 3 }],
                primitives: [{ vertexOffset: 0, vertexCount: vertices.length / 6 }]
            });

            ez.addInstance('grid');
        }
        createGrid();

        function updateUI() {
            const isOrtho = ez.camera.orthographic;
            modeBadge.textContent = isOrtho ? 'Orthographic' : 'Perspective';
            modeBadge.className = isOrtho ? 'mode-orthographic' : 'mode-perspective';

            if (isOrtho) {
                fovDisplay.style.display = 'none';
                orthoDisplay.style.display = 'block';
                orthoDisplay.textContent = `Ortho Size: ${ez.camera.orthoSize.toFixed(1)}`;
            } else {
                fovDisplay.style.display = 'block';
                orthoDisplay.style.display = 'none';
                fovDisplay.textContent = `FOV: ${ez.camera.fov.toFixed(0)}°`;
            }
        }

        function toggleMode() {
            ez.camera.set({
                orthographic: !ez.camera.orthographic
            });
            updateUI();
        }

        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;

            if (e.key.toLowerCase() === 'k') {
                toggleMode();
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 1 : -1;

            if (ez.camera.orthographic) {
                ez.camera.set({ orthoSize: Math.max(1, ez.camera.orthoSize + delta * 0.5) });
            } else {
                ez.camera.set({ fov: Math.max(10, Math.min(120, ez.camera.fov + delta * 2)) });
            }
            updateUI();
        }, { passive: false });

        function processInput() {
            const speed = 0.15;
            const rotSpeed = 2;

            if (keys['w']) {
                const f = ez.camera.forward;
                ez.camera.translate([f[0] * speed, f[1] * speed, f[2] * speed]);
            }
            if (keys['s']) {
                const f = ez.camera.forward;
                ez.camera.translate([-f[0] * speed, -f[1] * speed, -f[2] * speed]);
            }
            if (keys['a']) {
                const r = ez.camera.right;
                ez.camera.translate([-r[0] * speed, -r[1] * speed, -r[2] * speed]);
            }
            if (keys['d']) {
                const r = ez.camera.right;
                ez.camera.translate([r[0] * speed, r[1] * speed, r[2] * speed]);
            }
            if (keys['arrowup']) {
                ez.camera.rotate(rotSpeed, 0, 0);
            }
            if (keys['arrowdown']) {
                ez.camera.rotate(-rotSpeed, 0, 0);
            }
            if (keys['arrowleft']) {
                ez.camera.rotate(0, -rotSpeed, 0);
            }
            if (keys['arrowright']) {
                ez.camera.rotate(0, rotSpeed, 0);
            }
        }

        function loop() {
            processInput();
            ez.render();
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', () => {
            ez.settings.fitContainer();
        });

        updateUI();
        loop();
    </script>
</body>
</html>
