<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>meshTest</title>
	<style>
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			background: #08111d;
			color: #d8e4ff;
			font-family: Consolas, "Courier New", monospace;
		}
		#view {
			display: block;
			width: 100%;
			height: 100%;
		}
		#panel {
			position: fixed;
			top: 12px;
			left: 12px;
			padding: 10px;
			border: 1px solid #24364f;
			border-radius: 8px;
			background: #050d1ad8;
			backdrop-filter: blur(4px);
			min-width: 280px;
		}
		h1 {
			margin: 0 0 8px;
			font-size: 14px;
		}
		#hint,
		#fps,
		#meta {
			font-size: 12px;
			opacity: 0.92;
		}
		#hint { margin-bottom: 6px; }
	</style>
</head>
<body>
	<canvas id="view"></canvas>
	<section id="panel">
		<h1>meshTest</h1>
		<div id="hint">WrMesh + AzWBackend, no WrWorld</div>
		<div id="meta"></div>
		<div id="fps">FPS: -</div>
	</section>

	<script type="module">
		import { AzWBackend } from "./resources/js/AzLib/AzWBackend.js";
		import Azm from "./resources/js/AzLib/Azm.js";
		import AzCamera from "./resources/js/AzLib/AzCamera.js";
		import { WrMesh } from "./resources/js/WeebRender2/index.js";

		const canvas = document.getElementById("view");
		const fpsEl = document.getElementById("fps");
		const metaEl = document.getElementById("meta");

		const Mat4 = Azm.Mat4;
		const Vec3 = Azm.Vec3;
		const GPUBufferUsageRef = globalThis.GPUBufferUsage;
		const GPUShaderStageRef = globalThis.GPUShaderStage;

		const MOVE_SPEED = 10;
		const SHIFT_SPEED_MULT = 3.5;
		const LOOK_SENSITIVITY = 0.0022;
		const MAX_PITCH = Math.PI * 0.495;
		const DEPTH_FORMAT = "depth24plus";

		const shaderCode = `
		struct DrawUniforms {
			viewProj: mat4x4<f32>,
			bone0: mat4x4<f32>,
			bone1: mat4x4<f32>,
			albedo: vec4<f32>,
			morph: vec4<f32>,
		}

		struct VertexIn {
			@location(0) position: vec3<f32>,
			@location(1) normal: vec3<f32>,
			@location(2) uv: vec2<f32>,
			@location(3) boneId: vec4<f32>,
			@location(4) boneWeight: vec4<f32>,
		}

		struct VertexOut {
			@builtin(position) clipPos: vec4<f32>,
			@location(0) normal: vec3<f32>,
			@location(1) uv: vec2<f32>,
		}

		@group(0) @binding(0) var<uniform> drawU: DrawUniforms;
		@group(0) @binding(1) var<storage, read> morphPos: array<vec4<f32>>;

		fn skinPos(p: vec3<f32>, boneId: vec4<f32>, boneWeight: vec4<f32>) -> vec4<f32> {
			let p4 = vec4<f32>(p, 1.0);
			let m0 = drawU.bone0;
			let m1 = drawU.bone1;
			let s0 = m0 * p4;
			let s1 = m1 * p4;
			return s0 * boneWeight.x + s1 * boneWeight.y;
		}

		fn skinNrm(n: vec3<f32>, boneWeight: vec4<f32>) -> vec3<f32> {
			let n4 = vec4<f32>(n, 0.0);
			let s0 = (drawU.bone0 * n4).xyz;
			let s1 = (drawU.bone1 * n4).xyz;
			return normalize(s0 * boneWeight.x + s1 * boneWeight.y);
		}

		@vertex
		fn vs_main(input: VertexIn, @builtin(vertex_index) vertexIndex: u32) -> VertexOut {
			let targetIndex = u32(drawU.morph.x + 0.5);
			let targetWeight = drawU.morph.y;
			let vertexCount = u32(drawU.morph.z + 0.5);
			let morphIndex = targetIndex * vertexCount + vertexIndex;
			let delta = morphPos[morphIndex].xyz * targetWeight;

			let localPos = input.position + delta;
			let worldPos = skinPos(localPos, input.boneId, input.boneWeight);
			let worldNormal = skinNrm(input.normal, input.boneWeight);

			var out: VertexOut;
			out.clipPos = drawU.viewProj * worldPos;
			out.normal = worldNormal;
			out.uv = input.uv;
			return out;
		}

		@fragment
		fn fs_main(input: VertexOut) -> @location(0) vec4<f32> {
			let l = normalize(vec3<f32>(0.35, 0.8, 0.25));
			let ndl = max(dot(normalize(input.normal), l), 0.15);
			let checker = step(0.5, fract(input.uv.x * 6.0)) * step(0.5, fract(input.uv.y * 10.0));
			let modColor = mix(vec3<f32>(1.0), vec3<f32>(0.82, 0.86, 1.0), checker * 0.22);
			return vec4<f32>(drawU.albedo.rgb * modColor * ndl, drawU.albedo.a);
		}
		`;

		function createTestMesh() {
			const rows = 10;
			const width = 1.1;
			const height = 4.4;
			const mid = rows / 2;
			const vertexCount = (rows + 1) * 2;
			const position = new Float32Array(vertexCount * 3);
			const normal = new Float32Array(vertexCount * 3);
			const uv = new Float32Array(vertexCount * 2);
			const boneId = new Float32Array(vertexCount * 4);
			const boneWeight = new Float32Array(vertexCount * 4);

			let v = 0;
			for (let yStep = 0; yStep <= rows; yStep += 1) {
				const t = yStep / rows;
				const y = t * height;
				for (let xStep = 0; xStep <= 1; xStep += 1) {
					const x = (xStep === 0 ? -0.5 : 0.5) * width;
					position[v * 3 + 0] = x;
					position[v * 3 + 1] = y;
					position[v * 3 + 2] = 0;

					normal[v * 3 + 0] = 0;
					normal[v * 3 + 1] = 0;
					normal[v * 3 + 2] = 1;

					uv[v * 2 + 0] = xStep;
					uv[v * 2 + 1] = t;

					const w1 = Math.max(0, Math.min(1, (y - height * 0.35) / (height * 0.45)));
					const w0 = 1 - w1;
					boneId[v * 4 + 0] = 0;
					boneId[v * 4 + 1] = 1;
					boneId[v * 4 + 2] = 0;
					boneId[v * 4 + 3] = 0;
					boneWeight[v * 4 + 0] = w0;
					boneWeight[v * 4 + 1] = w1;
					boneWeight[v * 4 + 2] = 0;
					boneWeight[v * 4 + 3] = 0;
					v += 1;
				}
			}

			const indices = [];
			const sub0Start = 0;
			for (let row = 0; row < mid; row += 1) {
				const i0 = row * 2;
				const i1 = i0 + 1;
				const i2 = i0 + 2;
				const i3 = i0 + 3;
				indices.push(i0, i1, i2, i1, i3, i2);
			}
			const sub0Count = indices.length - sub0Start;
			const sub1Start = indices.length;
			for (let row = mid; row < rows; row += 1) {
				const i0 = row * 2;
				const i1 = i0 + 1;
				const i2 = i0 + 2;
				const i3 = i0 + 3;
				indices.push(i0, i1, i2, i1, i3, i2);
			}
			const sub1Count = indices.length - sub1Start;

			const targetCount = 2;
			const morphPos = new Float32Array(targetCount * vertexCount * 3);
			for (let i = 0; i < vertexCount; i += 1) {
				const px = position[i * 3 + 0];
				const py = position[i * 3 + 1];
				const t = py / height;

				if (t <= 0.6) {
					const d0 = (1 - Math.abs(px) / (width * 0.5)) * Math.sin(t * Math.PI * 2.5) * 0.26;
					morphPos[(0 * vertexCount + i) * 3 + 2] = d0;
				}
				if (t >= 0.35) {
					const d1 = Math.cos(t * Math.PI * 3.0 + px * 4.0) * 0.22;
					morphPos[(1 * vertexCount + i) * 3 + 0] = px * 0.18;
					morphPos[(1 * vertexCount + i) * 3 + 2] = d1;
				}
			}

			return new WrMesh({
				flags: WrMesh.Flags.Normal | WrMesh.Flags.UV | WrMesh.Flags.Bone | WrMesh.Flags.MorphPos,
				vertexCount,
				vertices: { position, normal, uv, boneId, boneWeight },
				indices: new Uint16Array(indices),
				primitives: [
					{
						firstIndex: sub0Start,
						indexCount: sub0Count,
						baseVertex: 0,
						material: { albedo: [0.86, 0.34, 0.28, 1] },
						morphBase: 0,
						morphCount: 1,
					},
					{
						firstIndex: sub1Start,
						indexCount: sub1Count,
						baseVertex: 0,
						material: { albedo: [0.24, 0.62, 0.92, 1] },
						morphBase: 1,
						morphCount: 1,
					},
				],
				morphDeltas: { position: morphPos },
			});
		}

		function packInterleaved(mesh) {
			const strideFloats = 16;
			const out = new Float32Array(mesh.vertexCount * strideFloats);
			for (let i = 0; i < mesh.vertexCount; i += 1) {
				const o = i * strideFloats;
				out[o + 0] = mesh.vertices.position[i * 3 + 0];
				out[o + 1] = mesh.vertices.position[i * 3 + 1];
				out[o + 2] = mesh.vertices.position[i * 3 + 2];
				out[o + 3] = mesh.vertices.normal[i * 3 + 0];
				out[o + 4] = mesh.vertices.normal[i * 3 + 1];
				out[o + 5] = mesh.vertices.normal[i * 3 + 2];
				out[o + 6] = mesh.vertices.uv[i * 2 + 0];
				out[o + 7] = mesh.vertices.uv[i * 2 + 1];
				out[o + 8] = mesh.vertices.boneId[i * 4 + 0];
				out[o + 9] = mesh.vertices.boneId[i * 4 + 1];
				out[o + 10] = mesh.vertices.boneId[i * 4 + 2];
				out[o + 11] = mesh.vertices.boneId[i * 4 + 3];
				out[o + 12] = mesh.vertices.boneWeight[i * 4 + 0];
				out[o + 13] = mesh.vertices.boneWeight[i * 4 + 1];
				out[o + 14] = mesh.vertices.boneWeight[i * 4 + 2];
				out[o + 15] = mesh.vertices.boneWeight[i * 4 + 3];
			}
			return out;
		}

		function packMorphVec4(mesh) {
			const targetCount = Math.max(1, ...mesh.primitives.map((primitive) => primitive.morphBase + primitive.morphCount));
			const out = new Float32Array(targetCount * mesh.vertexCount * 4);
			const src = mesh.morphDeltas.position ?? new Float32Array(0);
			for (let t = 0; t < targetCount; t += 1) {
				for (let v = 0; v < mesh.vertexCount; v += 1) {
					const s = (t * mesh.vertexCount + v) * 3;
					const d = (t * mesh.vertexCount + v) * 4;
					out[d + 0] = src[s + 0] ?? 0;
					out[d + 1] = src[s + 1] ?? 0;
					out[d + 2] = src[s + 2] ?? 0;
					out[d + 3] = 0;
				}
			}
			return { data: out, targetCount };
		}

		function makeBoneMatrices(timeSec) {
			const bone0 = Mat4.makeIdentity();
			const bone1 = Mat4.makeIdentity();

			const invBind0 = Mat4.makeIdentity();
			const invBind1 = Mat4.makeIdentity();
			Mat4.translate(invBind1, [0, -1.9, 0], invBind1);

			const world0 = Mat4.makeIdentity();
			Mat4.rotateZ(world0, Math.sin(timeSec * 1.3) * 0.45, world0);

			const world1 = Mat4.makeIdentity();
			Mat4.mul(world0, Mat4.translate(Mat4.makeIdentity(), [0, 1.9, 0], Mat4.makeIdentity()), world1);
			Mat4.rotateZ(world1, Math.sin(timeSec * 1.9 + 0.8) * 0.8, world1);

			Mat4.mul(world0, invBind0, bone0);
			Mat4.mul(world1, invBind1, bone1);
			return { bone0, bone1 };
		}

		const backend = new AzWBackend.WGPU(canvas, { context: { alphaMode: "premultiplied" } });
		await backend.init();
		backend.resize({ maxPixelRatio: 2 });

		const mesh = createTestMesh();
		const check = mesh.validate();
		if (!check.ok) throw new Error(`WrMesh validate failed: ${check.errors.join(", ")}`);

		metaEl.textContent = `verts ${mesh.vertexCount} | indices ${mesh.indices.length} | submeshes ${mesh.primitives.length}`;

		const packed = packInterleaved(mesh);
		const morphPacked = packMorphVec4(mesh);

		const vertexBuffer = backend.createBuffer({
			label: "meshTestVertex",
			size: packed.byteLength,
			usage: GPUBufferUsageRef.VERTEX | GPUBufferUsageRef.COPY_DST,
		});
		backend.writeBuffer(vertexBuffer, packed);

		const indexBuffer = backend.createBuffer({
			label: "meshTestIndex",
			size: mesh.indices.byteLength,
			usage: GPUBufferUsageRef.INDEX | GPUBufferUsageRef.COPY_DST,
		});
		backend.writeBuffer(indexBuffer, mesh.indices);

		const morphBuffer = backend.createBuffer({
			label: "meshTestMorphPos",
			size: morphPacked.data.byteLength,
			usage: GPUBufferUsageRef.STORAGE | GPUBufferUsageRef.COPY_DST,
		});
		backend.writeBuffer(morphBuffer, morphPacked.data);

		const shader = backend.createShaderModule({ label: "meshTestShader", code: shaderCode });

		const bindGroupLayout = backend.createBindGroupLayout({
			label: "meshTestBGL",
			entries: [
				{ binding: 0, visibility: GPUShaderStageRef.VERTEX | GPUShaderStageRef.FRAGMENT, buffer: { type: "uniform" } },
				{ binding: 1, visibility: GPUShaderStageRef.VERTEX, buffer: { type: "read-only-storage" } },
			],
		});

		const pipelineLayout = backend.device.createPipelineLayout({
			label: "meshTestPL",
			bindGroupLayouts: [bindGroupLayout],
		});

		const pipeline = backend.createRenderPipeline({
			label: "meshTestPipeline",
			layout: pipelineLayout,
			vertex: {
				module: shader,
				entryPoint: "vs_main",
				buffers: [{
					arrayStride: 64,
					stepMode: "vertex",
					attributes: [
						{ shaderLocation: 0, offset: 0, format: "float32x3" },
						{ shaderLocation: 1, offset: 12, format: "float32x3" },
						{ shaderLocation: 2, offset: 24, format: "float32x2" },
						{ shaderLocation: 3, offset: 32, format: "float32x4" },
						{ shaderLocation: 4, offset: 48, format: "float32x4" },
					],
				}],
			},
			fragment: {
				module: shader,
				entryPoint: "fs_main",
				targets: [{ format: backend.format }],
			},
			primitive: {
				topology: "triangle-list",
				cullMode: "back",
				frontFace: "ccw",
			},
			depthStencil: {
				format: DEPTH_FORMAT,
				depthWriteEnabled: true,
				depthCompare: "less",
			},
		});

		const primitiveGpu = mesh.primitives.map((_primitive, i) => {
			const uniformBuffer = backend.createBuffer({
				label: `meshTestUniform_${i}`,
				size: 224,
				usage: GPUBufferUsageRef.UNIFORM | GPUBufferUsageRef.COPY_DST,
			});
			const bindGroup = backend.createBindGroup({
				label: `meshTestBG_${i}`,
				layout: bindGroupLayout,
				entries: [
					{ binding: 0, resource: { buffer: uniformBuffer } },
					{ binding: 1, resource: { buffer: morphBuffer } },
				],
			});
			return {
				uniformBuffer,
				bindGroup,
				uniformData: new Float32Array(56),
			};
		});

		const viewProj = Mat4.makeIdentity();
		const camera = new AzCamera({
			position: [0, 2.2, 8],
			fov: 58,
			near: 0.1,
			far: 500,
			aspect: 1,
		});
		camera.lookAt([0, 2, 0]);

		let yaw = 0;
		let pitch = 0;
		{
			const f = camera.forward;
			yaw = Math.atan2(-f[0], -f[2]);
			pitch = Math.asin(Math.max(-1, Math.min(1, f[1])));
			camera.setYawPitch(yaw, pitch, 0);
		}

		const keys = { w: false, a: false, s: false, d: false, shift: false };
		let pointerLocked = false;
		document.addEventListener("keydown", (e) => {
			if (e.code === "KeyW") keys.w = true;
			if (e.code === "KeyA") keys.a = true;
			if (e.code === "KeyS") keys.s = true;
			if (e.code === "KeyD") keys.d = true;
			if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.shift = true;
		});
		document.addEventListener("keyup", (e) => {
			if (e.code === "KeyW") keys.w = false;
			if (e.code === "KeyA") keys.a = false;
			if (e.code === "KeyS") keys.s = false;
			if (e.code === "KeyD") keys.d = false;
			if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.shift = false;
		});
		document.addEventListener("pointerlockchange", () => {
			pointerLocked = document.pointerLockElement === canvas;
		});
		document.addEventListener("mousemove", (e) => {
			if (!pointerLocked) return;
			yaw -= e.movementX * LOOK_SENSITIVITY;
			pitch -= e.movementY * LOOK_SENSITIVITY;
			if (pitch > MAX_PITCH) pitch = MAX_PITCH;
			if (pitch < -MAX_PITCH) pitch = -MAX_PITCH;
			camera.setYawPitch(yaw, pitch, 0);
		});
		canvas.addEventListener("click", () => {
			if (document.pointerLockElement !== canvas) canvas.requestPointerLock();
		});

		let lastTime = performance.now() * 0.001;
		let lastFpsTime = performance.now();
		let frames = 0;

		function drawPrimitive(pass, primitiveIndex, primitive, timeSec, bone0, bone1) {
			const gpu = primitiveGpu[primitiveIndex];
			const uniformData = gpu.uniformData;

			uniformData.set(viewProj, 0);
			uniformData.set(bone0, 16);
			uniformData.set(bone1, 32);

			const color = primitive.material?.albedo ?? [1, 1, 1, 1];
			uniformData[48] = color[0];
			uniformData[49] = color[1];
			uniformData[50] = color[2];
			uniformData[51] = color[3];

			const localWeight = 0.5 + 0.5 * Math.sin(timeSec * (primitive.morphBase === 0 ? 1.4 : 2.1) + primitive.morphBase * 1.2);
			uniformData[52] = primitive.morphBase;
			uniformData[53] = localWeight;
			uniformData[54] = mesh.vertexCount;
			uniformData[55] = 0;
			backend.writeBuffer(gpu.uniformBuffer, uniformData, 0);
			pass.setBindGroup(0, gpu.bindGroup);
			pass.drawIndexed(primitive.indexCount, 1, primitive.firstIndex, primitive.baseVertex, 0);
		}

		function frame(nowMs) {
			backend.resize({ maxPixelRatio: 2 });

			const now = nowMs * 0.001;
			const dt = Math.max(0, Math.min(0.05, now - lastTime));
			lastTime = now;

			let moveForward = 0;
			let moveRight = 0;
			if (keys.w) moveForward += 1;
			if (keys.s) moveForward -= 1;
			if (keys.d) moveRight += 1;
			if (keys.a) moveRight -= 1;
			if (moveForward !== 0 || moveRight !== 0) {
				const speed = MOVE_SPEED * (keys.shift ? SHIFT_SPEED_MULT : 1) * dt;
				const f = camera.forward;
				const r = camera.right;
				camera.position[0] += (f[0] * moveForward + r[0] * moveRight) * speed;
				camera.position[1] += (f[1] * moveForward + r[1] * moveRight) * speed;
				camera.position[2] += (f[2] * moveForward + r[2] * moveRight) * speed;
			}

			camera.aspect = Math.max(1e-5, canvas.width / canvas.height);
			Mat4.mul(camera.projection, camera.view, viewProj);

			const bones = makeBoneMatrices(now);

			backend.beginFrame({ useDepth: true, clearColorEnabled: false, clearDepthEnabled: false });
			const pass = backend.beginRenderPass({
				clearColor: [0.03, 0.05, 0.09, 1],
				clearDepth: 1,
				clearColorEnabled: true,
				clearDepthEnabled: true,
				useDepth: true,
			});

			pass.setPipeline(pipeline);
			pass.setVertexBuffer(0, vertexBuffer);
			pass.setIndexBuffer(indexBuffer, mesh.indexType === "u32" ? "uint32" : "uint16");
			for (let i = 0; i < mesh.primitives.length; i += 1) {
				drawPrimitive(pass, i, mesh.primitives[i], now, bones.bone0, bones.bone1);
			}
			pass.end();
			backend.endFrame();

			frames += 1;
			if (nowMs - lastFpsTime >= 400) {
				const fps = (frames * 1000) / (nowMs - lastFpsTime);
				fpsEl.textContent = `FPS: ${fps.toFixed(1)}`;
				frames = 0;
				lastFpsTime = nowMs;
			}

			requestAnimationFrame(frame);
		}

		window.addEventListener("beforeunload", () => backend.destroy());
		window.__meshTest = { backend, mesh, pipeline, camera };
		requestAnimationFrame(frame);
	</script>
</body>
</html>
