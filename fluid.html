<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fluid Carton Base</title>
    <style>
        :root {
            --bg: #9AB7F8;
            --panel: #25355bbb;
            --line: #7f95c84a;
            --txt: #e8f0ff;
            --sub: #c9d8ff;
            --accent: #66d9ff;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--txt);
            font-family: monospace;
        }
        #app { position: fixed; inset: 0; }
        #panel {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
            backdrop-filter: blur(6px);
            width: 310px;
        }
        h1 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
        p { margin: 0; font-size: 12px; line-height: 1.4; color: var(--sub); }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="panel">
        <h1>Carton Base Test</h1>
        <p>Rounded/beveled carton geometry + smooth shading.</p>
        <p>Both passes render backfaces (`cull: front`).</p>
        <p>Drag mouse to orbit, wheel to zoom.</p>
    </div>

    <script src="./resources/js/WeebGL/ZMath.js"></script>
    <script src="./resources/js/WeebGL/ZCanvas.js"></script>
    <script>
    (() => {
        const app = document.getElementById("app");
        const zc = new ZCanvas("carton-base", { antialias: true, alpha: false });
        zc.mount(app).fitContainer();
        const gl = zc.gl;
        new ResizeObserver(() => zc.fitContainer()).observe(app);

        function buildCartonGeometry() {
            const hw = 0.40;
            const hh = 0.90;
            const hd = 0.40;
            const roofStartY = 0.34;
            const peakHalfWidth = 0.035;
            const sliceCount = 22;
            const cornerSeg = 4;
            const bevel = 0.00;

            const vertices = [];
            const rings = [];
            const indices = [];

            const lerp = (a, b, t) => a + (b - a) * t;
            const sat = (v) => Math.max(0, Math.min(1, v));
            const smooth = (t) => t * t * (3 - 2 * t);

            function halfWidthAt(y) {
                if (y <= roofStartY) return hw;
                const t = sat((y - roofStartY) / Math.max(1e-6, hh - roofStartY));
                const k = smooth(t);
                return lerp(hw, peakHalfWidth, k);
            }

            function halfDepthAt(y) {
                if (y <= roofStartY) return hd;
                const t = sat((y - roofStartY) / Math.max(1e-6, hh - roofStartY));
                const k = smooth(t);
                return lerp(hd, hd * 0.92, k);
            }

            function buildRoundedRectRing(ex, ez, radius) {
                const rr = Math.max(0, Math.min(radius, ex * 0.48, ez * 0.48));
                const x0 = -ex, x1 = ex;
                const z0 = -ez, z1 = ez;
                const cxL = x0 + rr, cxR = x1 - rr;
                const czB = z0 + rr, czT = z1 - rr;
                const out = [];

                function pushPoint(x, z) {
                    const n = out.length;
                    if (n > 0) {
                        const p = out[n - 1];
                        if (Math.abs(p[0] - x) < 1e-6 && Math.abs(p[1] - z) < 1e-6) return;
                    }
                    out.push([x, z]);
                }

                function pushArc(cx, cz, a0, a1, includeStart) {
                    for (let i = includeStart ? 0 : 1; i <= cornerSeg; i++) {
                        const t = i / cornerSeg;
                        const a = lerp(a0, a1, t);
                        pushPoint(cx + Math.cos(a) * rr, cz + Math.sin(a) * rr);
                    }
                }

                if (rr <= 1e-6) {
                    return [[x1, z1], [x0, z1], [x0, z0], [x1, z0]];
                }

                // Continuous clockwise contour.
                pushPoint(cxR, z1);
                pushPoint(cxL, z1);
                pushArc(cxL, czT, Math.PI * 0.5, Math.PI, false);       // top-left
                pushPoint(x0, czB);
                pushArc(cxL, czB, Math.PI, Math.PI * 1.5, false);       // bottom-left
                pushPoint(cxR, z0);
                pushArc(cxR, czB, Math.PI * 1.5, Math.PI * 2.0, false); // bottom-right
                pushPoint(x1, czT);
                pushArc(cxR, czT, 0.0, Math.PI * 0.5, false);            // top-right

                if (out.length > 2) {
                    const f = out[0];
                    const l = out[out.length - 1];
                    if (Math.abs(f[0] - l[0]) < 1e-6 && Math.abs(f[1] - l[1]) < 1e-6) out.pop();
                }
                return out;
            }

            function addVertex(x, y, z) {
                vertices.push(x, y, z);
                return (vertices.length / 3) - 1;
            }

            for (let iy = 0; iy <= sliceCount; iy++) {
                const ty = iy / sliceCount;
                const y = lerp(-hh, hh, ty);
                const ex = halfWidthAt(y);
                const ez = halfDepthAt(y);
                const roofT = sat((y - roofStartY) / Math.max(1e-6, hh - roofStartY));
                const localBevel = lerp(bevel, bevel * 0.35, smooth(roofT));
                const ring2D = buildRoundedRectRing(ex, ez, localBevel);
                const ring = new Array(ring2D.length);

                for (let is = 0; is < ring2D.length; is++) {
                    ring[is] = addVertex(ring2D[is][0], y, ring2D[is][1]);
                }
                rings.push(ring);
            }

            for (let iy = 0; iy < sliceCount; iy++) {
                const ra = rings[iy];
                const rb = rings[iy + 1];
                const steps = ra.length;
                for (let is = 0; is < steps; is++) {
                    const ns = (is + 1) % steps;
                    const a = ra[is];
                    const b = ra[ns];
                    const c = rb[ns];
                    const d = rb[is];
                    indices.push(a, c, b);
                    indices.push(a, d, c);
                }
            }

            const bottomCenter = addVertex(0, -hh, 0);
            const topCenter = addVertex(0, hh, 0);

            for (let is = 0; is < rings[0].length; is++) {
                const ns = (is + 1) % rings[0].length;
                const a = rings[0][is];
                const b = rings[0][ns];
                const c = rings[sliceCount][is];
                const d = rings[sliceCount][ns];
                indices.push(bottomCenter, a, b);
                indices.push(topCenter, d, c);
            }

            const positions = new Float32Array(indices.length * 3);
            const normals = new Float32Array(indices.length * 3);
            const normalAccum = new Float32Array(vertices.length);

            // Mesh center from unique vertices.
            const center = [0, 0, 0];
            const vCount = vertices.length / 3;
            for (let i = 0; i < vCount; i++) {
                center[0] += vertices[i * 3 + 0];
                center[1] += vertices[i * 3 + 1];
                center[2] += vertices[i * 3 + 2];
            }
            center[0] /= Math.max(1, vCount);
            center[1] /= Math.max(1, vCount);
            center[2] /= Math.max(1, vCount);

            // Blender-like recalculate outside:
            // 1) face normal from triangle winding
            // 2) force it outward using centroid vs mesh center
            // 3) accumulate to each vertex for smooth normals
            for (let i = 0; i < indices.length; i += 3) {
                const ia = indices[i + 0] * 3;
                const ib = indices[i + 1] * 3;
                const ic = indices[i + 2] * 3;

                const ax = vertices[ia + 0], ay = vertices[ia + 1], az = vertices[ia + 2];
                const bx = vertices[ib + 0], by = vertices[ib + 1], bz = vertices[ib + 2];
                const cx = vertices[ic + 0], cy = vertices[ic + 1], cz = vertices[ic + 2];

                const abx = bx - ax, aby = by - ay, abz = bz - az;
                const acx = cx - ax, acy = cy - ay, acz = cz - az;

                let nx = aby * acz - abz * acy;
                let ny = abz * acx - abx * acz;
                let nz = abx * acy - aby * acx;

                const fx = (ax + bx + cx) / 3 - center[0];
                const fy = (ay + by + cy) / 3 - center[1];
                const fz = (az + bz + cz) / 3 - center[2];
                const outDot = nx * fx + ny * fy + nz * fz;
                if (outDot < 0) {
                    nx = -nx;
                    ny = -ny;
                    nz = -nz;
                }

                normalAccum[ia + 0] += nx; normalAccum[ia + 1] += ny; normalAccum[ia + 2] += nz;
                normalAccum[ib + 0] += nx; normalAccum[ib + 1] += ny; normalAccum[ib + 2] += nz;
                normalAccum[ic + 0] += nx; normalAccum[ic + 1] += ny; normalAccum[ic + 2] += nz;
            }

            for (let i = 0; i < indices.length; i++) {
                const vi = indices[i];
                const src = vi * 3;
                const dst = i * 3;
                const x = vertices[src + 0];
                const y = vertices[src + 1];
                const z = vertices[src + 2];

                positions[dst + 0] = x;
                positions[dst + 1] = y;
                positions[dst + 2] = z;

                let nx = normalAccum[src + 0];
                let ny = normalAccum[src + 1];
                let nz = normalAccum[src + 2];
                let nl = Math.hypot(nx, ny, nz);
                if (nl < 1e-6) {
                    nx = x - center[0];
                    ny = y - center[1];
                    nz = z - center[2];
                    nl = Math.hypot(nx, ny, nz) || 1;
                }
                normals[dst + 0] = nx / nl;
                normals[dst + 1] = ny / nl;
                normals[dst + 2] = nz / nl;
            }

            return { positions, normals, count: indices.length };
        }

        function buildInnerOutlineGeometry() {
            const hw = 0.40;
            const hh = 0.90;
            const hd = 0.40;
            const roofY = 0.34;
            const ridgeHalf = 0.035;
            const thick = 0.018;
            const roofEdgeY = hh - 0.055; // lower than apex so line mesh hugs rounded roof better

            const p0 = [-hw, -hh, -hd];
            const p1 = [ hw, -hh, -hd];
            const p2 = [ hw, -hh,  hd];
            const p3 = [-hw, -hh,  hd];

            const p4 = [-hw, roofY, -hd];
            const p5 = [ hw, roofY, -hd];
            const p6 = [ hw, roofY,  hd];
            const p7 = [-hw, roofY,  hd];

            const p8 = [-ridgeHalf, roofEdgeY, -hd];
            const p9 = [ ridgeHalf, roofEdgeY, -hd];
            const p10 = [-ridgeHalf, roofEdgeY, hd];
            const p11 = [ ridgeHalf, roofEdgeY, hd];
            const apexFront = [0, roofEdgeY, -hd];
            const apexBack = [0, roofEdgeY, hd];

            const segments = [
                [p0, p1], [p1, p2], [p2, p3], [p3, p0], // bottom
                [p0, p4], [p1, p5], [p2, p6], [p3, p7], // vertical
                [p4, p5], [p5, p6], [p6, p7], [p7, p4], // shoulder
                [p4, apexFront], [p5, apexFront], [p7, apexBack], [p6, apexBack], // roof slopes
            ];
            const alwaysVisibleSegments = [
                [apexFront, apexBack], // single roof apex ridge line
            ];

            const positions = [];
            const center = [0, (roofY - hh) * 0.2, 0];

            function addTri(a, b, c) {
                positions.push(a[0], a[1], a[2]);
                positions.push(b[0], b[1], b[2]);
                positions.push(c[0], c[1], c[2]);
            }

            function addEdgeRibbon(a, b, r, doubleSided = false) {
                let dx = b[0] - a[0];
                let dy = b[1] - a[1];
                let dz = b[2] - a[2];
                const dl = Math.hypot(dx, dy, dz) || 1;
                dx /= dl; dy /= dl; dz /= dl;

                const mx = (a[0] + b[0]) * 0.5;
                const my = (a[1] + b[1]) * 0.5;
                const mz = (a[2] + b[2]) * 0.5;
                let rx = mx - center[0];
                let ry = my - center[1];
                let rz = mz - center[2];
                const rl = Math.hypot(rx, ry, rz) || 1;
                rx /= rl; ry /= rl; rz /= rl;

                let wx = dy * rz - dz * ry;
                let wy = dz * rx - dx * rz;
                let wz = dx * ry - dy * rx;
                let wl = Math.hypot(wx, wy, wz);
                if (wl < 1e-6) {
                    wx = -dz; wy = 0; wz = dx;
                    wl = Math.hypot(wx, wy, wz) || 1;
                }
                wx = (wx / wl) * (r * 0.5);
                wy = (wy / wl) * (r * 0.5);
                wz = (wz / wl) * (r * 0.5);

                let a0 = [a[0] - wx, a[1] - wy, a[2] - wz];
                let a1 = [a[0] + wx, a[1] + wy, a[2] + wz];
                let b0 = [b[0] - wx, b[1] - wy, b[2] - wz];
                let b1 = [b[0] + wx, b[1] + wy, b[2] + wz];

                // Ensure quad front faces point roughly outward from object center.
                const u1x = a1[0] - a0[0], u1y = a1[1] - a0[1], u1z = a1[2] - a0[2];
                const u2x = b1[0] - a0[0], u2y = b1[1] - a0[1], u2z = b1[2] - a0[2];
                const fnx = u1y * u2z - u1z * u2y;
                const fny = u1z * u2x - u1x * u2z;
                const fnz = u1x * u2y - u1y * u2x;
                if (fnx * rx + fny * ry + fnz * rz < 0) {
                    const ta = a0; a0 = a1; a1 = ta;
                    const tb = b0; b0 = b1; b1 = tb;
                }

                addTri(a0, a1, b1);
                addTri(a0, b1, b0);
                if (doubleSided) {
                    addTri(a0, b1, a1);
                    addTri(a0, b0, b1);
                }
            }

            for (let i = 0; i < segments.length; i++) {
                addEdgeRibbon(segments[i][0], segments[i][1], thick);
            }
            for (let i = 0; i < alwaysVisibleSegments.length; i++) {
                addEdgeRibbon(alwaysVisibleSegments[i][0], alwaysVisibleSegments[i][1], thick, true);
            }

            return {
                positions: new Float32Array(positions),
                count: positions.length / 3,
                minY: -hh,
                maxY: roofEdgeY,
            };
        }

        function makeBoxShader() {
            return new ZShader()
                .write({ version: "300 es" })
                .write({
                    stage: ZShader.STAGE.VERTEX,
                    inputs: [
                        { name: "a_position", type: "vec3" },
                        { name: "a_normal", type: "vec3" },
                    ],
                    uniforms: [
                        { name: "u_proj", type: "mat4" },
                        { name: "u_view", type: "mat4" },
                        { name: "u_model", type: "mat4" },
                        { name: "u_outlineWidth", type: "float" },
                    ],
                    methods: [
                        {
                            signature: "vec3 safeNormalize(vec3 v)",
                            body: "float L = max(length(v), 1e-6);\nreturn v / L;"
                        }
                    ],
                    main: `
                        vec3 n = safeNormalize(a_normal);
                        vec3 p = a_position + n * u_outlineWidth;
                        gl_Position = u_proj * u_view * u_model * vec4(p, 1.0);
                    `,
                })
                .write({
                    stage: ZShader.STAGE.FRAGMENT,
                    outputs: [
                        { name: "fragColor", type: "vec4" },
                    ],
                    uniforms: [
                        { name: "u_color", type: "vec3" },
                    ],
                    main: `
                        fragColor = vec4(u_color, 1.0);
                    `,
                })
                .compile(gl);
        }

        function makeInnerLineShader() {
            return new ZShader()
                .write({ version: "300 es" })
                .write({
                    links: [
                        { name: "v_worldPos", type: "vec3" },
                        { name: "v_localPos", type: "vec3" },
                    ],
                })
                .write({
                    stage: ZShader.STAGE.VERTEX,
                    inputs: [
                        { name: "a_position", type: "vec3" },
                    ],
                    uniforms: [
                        { name: "u_proj", type: "mat4" },
                        { name: "u_view", type: "mat4" },
                        { name: "u_model", type: "mat4" },
                        { name: "u_insetScale", type: "float" },
                    ],
                    main: `
                        vec3 p = a_position * u_insetScale;
                        vec4 wp = u_model * vec4(p, 1.0);
                        v_worldPos = wp.xyz;
                        v_localPos = p;
                        gl_Position = u_proj * u_view * wp;
                    `,
                })
                .write({
                    stage: ZShader.STAGE.FRAGMENT,
                    outputs: [
                        { name: "fragColor", type: "vec4" },
                    ],
                    uniforms: [
                        { name: "u_color", type: "vec3" },
                        { name: "u_localMinY", type: "float" },
                        { name: "u_localMaxY", type: "float" },
                    ],
                    main: `
                        float t = clamp((v_localPos.y - u_localMinY) / max(1e-6, u_localMaxY - u_localMinY), 0.0, 1.0);
                        // Bottom -> transparent, top -> opaque.
                        float a = smoothstep(0.16, 0.92, t);
                        if (a <= 0.16) discard;
                        if (a < 0.92) {
                            // Object-space alpha hash, stable when moving object in world.
                            float ah = smoothstep(0.16, 0.92, a);
                            float freq = mix(13.0, 38.0, ah);
                            vec3 q = floor((v_localPos + vec3(2.0)) * freq);
                            float h = fract(sin(dot(q, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
                            if (h > ah) discard;
                        }
                        fragColor = vec4(u_color, 1.0);
                    `,
                })
                .compile(gl);
        }

        const geom = buildCartonGeometry();
        const innerGeom = buildInnerOutlineGeometry();
        const posBuf = new ZBuffer(gl, gl.ARRAY_BUFFER, gl.STATIC_DRAW).upload(geom.positions);
        const nrmBuf = new ZBuffer(gl, gl.ARRAY_BUFFER, gl.STATIC_DRAW).upload(geom.normals);
        const innerPosBuf = new ZBuffer(gl, gl.ARRAY_BUFFER, gl.STATIC_DRAW).upload(innerGeom.positions);

        function makeVAO(shader, posBuffer, nrmBuffer = null) {
            const vao = gl.createVertexArray();
            gl.bindVertexArray(vao);

            const pLoc = shader.getInputLocation("a_position");
            if (pLoc !== -1) {
                ZRender.wireAttr(gl, {
                    buffer: posBuffer.handle,
                    loc: pLoc,
                    size: 3,
                    type: gl.FLOAT,
                    normalized: false,
                    stride: 12,
                    offset: 0,
                });
            }

            const nLoc = shader.getInputLocation("a_normal");
            if (nLoc !== -1 && nrmBuffer) {
                ZRender.wireAttr(gl, {
                    buffer: nrmBuffer.handle,
                    loc: nLoc,
                    size: 3,
                    type: gl.FLOAT,
                    normalized: false,
                    stride: 12,
                    offset: 0,
                });
            }

            gl.bindVertexArray(null);
            return vao;
        }

        const boxShader = makeBoxShader();
        const innerLineShader = makeInnerLineShader();
        const boxVAO = makeVAO(boxShader, posBuf, nrmBuf);
        const innerLineVAO = makeVAO(innerLineShader, innerPosBuf, null);

        const cam = { yaw: -0.72, pitch: 0.23, dist: 3.6, drag: false, lx: 0, ly: 0 };
        const cv = zc.canvas;

        cv.addEventListener("mousedown", (e) => { cam.drag = true; cam.lx = e.clientX; cam.ly = e.clientY; });
        window.addEventListener("mouseup", () => { cam.drag = false; });
        window.addEventListener("mousemove", (e) => {
            if (!cam.drag) return;
            const dx = e.clientX - cam.lx;
            const dy = e.clientY - cam.ly;
            cam.lx = e.clientX;
            cam.ly = e.clientY;
            cam.yaw -= dx * 0.005;
            cam.pitch = Math.max(-1.3, Math.min(1.3, cam.pitch - dy * 0.004));
        });
        cv.addEventListener("wheel", (e) => {
            e.preventDefault();
            cam.dist = Math.max(1.8, Math.min(7.5, cam.dist + e.deltaY * 0.003));
        }, { passive: false });

        const proj = ZMath.M4();
        const view = ZMath.M4();
        const model = ZMath.M4.identity();

        function drawBoxPass(color, outlineWidth) {
            boxShader.bind(gl);
            boxShader.setUniform(gl, "u_proj", proj);
            boxShader.setUniform(gl, "u_view", view);
            boxShader.setUniform(gl, "u_model", model);
            boxShader.setUniform(gl, "u_outlineWidth", outlineWidth);
            boxShader.setUniform(gl, "u_color", color);

            gl.bindVertexArray(boxVAO);
            gl.drawArrays(gl.TRIANGLES, 0, geom.count);
            gl.bindVertexArray(null);
        }

        function drawInnerLinePass(color, insetScale) {
            innerLineShader.bind(gl);
            innerLineShader.setUniform(gl, "u_proj", proj);
            innerLineShader.setUniform(gl, "u_view", view);
            innerLineShader.setUniform(gl, "u_model", model);
            innerLineShader.setUniform(gl, "u_insetScale", insetScale);
            innerLineShader.setUniform(gl, "u_color", color);
            innerLineShader.setUniform(gl, "u_localMinY", innerGeom.minY + 0.02);
            innerLineShader.setUniform(gl, "u_localMaxY", innerGeom.maxY);

            gl.bindVertexArray(innerLineVAO);
            gl.drawArrays(gl.TRIANGLES, 0, innerGeom.count);
            gl.bindVertexArray(null);
        }

        function frame() {
            const w = Math.max(1, zc.canvas.width);
            const h = Math.max(1, zc.canvas.height);
            const aspect = w / h;

            const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
            const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
            const eye = ZMath.V3.set(cy * cp * cam.dist, sp * cam.dist + 0.08, sy * cp * cam.dist);
            const target = ZMath.V3.set(0, 0.1, 0);
            const up = ZMath.V3.set(0, 1, 0);

            ZMath.M4.perspective(Math.PI * 0.33, aspect, 0.01, 50.0, proj);
            ZMath.M4.lookAt(eye, target, up, view);

            ZRender.setState(gl, {
                clear: ["color", "depth"],
                clearColor: [0.604, 0.718, 0.973, 1.0],
                depthTest: true,
                depthWrite: true,
                blend: false,
                cull: "front",
            });

            drawBoxPass(new Float32Array([0.0, 0.0, 0.0]), 0.055);
            drawBoxPass(new Float32Array([1.0, 1.0, 1.0]), 0.0);

            ZRender.setState(gl, {
                depthTest: true,
                depthWrite: true,
                blend: false,
                cull: "back",
            });
            drawInnerLinePass(new Float32Array([0.60, 0.50, 0.90]), 0.985);

            requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
